# =============================================================================
# YOLOv4 Hyperparameters, Architecture & Training Configuration
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Image & Architecture Settings
# -----------------------------------------------------------------------------
img_size: 416
multi_scale: [320, 352, 384, 416, 448, 480, 512, 544, 576, 608]
scale_interval: 10 # Vary image size every N batches during training

# Multi-scale feature map strides:
# Scale 0: Stride 32 (13x13 grid) -> Large objects
# Scale 1: Stride 16 (26x26 grid) -> Medium objects
# Scale 2: Stride 8  (52x52 grid) -> Small objects
strides: [32, 16, 8]

# Anchors priors (width, height in pixels relative to 416x416):
# 3 anchors per scale (Scale 0: large, Scale 1: medium, Scale 2: small)
anchors:
  - [[116, 90], [156, 198], [373, 326]] # Scale 0 (13x13)
  - [[30, 61], [62, 45], [59, 119]]     # Scale 1 (26x26)
  - [[10, 13], [16, 30], [33, 23]]      # Scale 2 (52x52)


# -----------------------------------------------------------------------------
# 2. Training & Optimizer
# -----------------------------------------------------------------------------
seed: 42
epochs: 100
batch_size: 16
num_workers: 4
optimizer: "AdamW"
lr0: 0.001    # Initial learning rate
lrf: 0.01     # Final learning rate factor (lr0 * lrf for Cosine Annealing)
momentum: 0.937
weight_decay: 0.0005

# Warmup schedule
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Model EMA (Exponential Moving Average)
ema_decay: 0.9999


# -----------------------------------------------------------------------------
# 3. Loss Gains & Hyperparameters (Bag of Freebies)
# -----------------------------------------------------------------------------
box_gain: 0.05        # CIoU coordinate loss gain
obj_gain: 1.0         # Objectness loss gain (BCE)
cls_gain: 0.5         # Classification loss gain (BCE)
ignore_thresh: 0.5    # IoU threshold for ignoring negative anchors
label_smoothing: 0.0  # Label smoothing epsilon


# -----------------------------------------------------------------------------
# 4. Data Augmentation (Bag of Freebies)
# -----------------------------------------------------------------------------
mosaic: 1.0           # Probability of 4-image Mosaic augmentation
mixup: 0.0            
hsv_h: 0.015          # Image HSV-Hue augmentation (fraction)
hsv_s: 0.7            # Image HSV-Saturation (fraction)
hsv_v: 0.4            # Image HSV-Value (fraction)
degrees: 0.0          # Image rotation (+/- degrees)
translate: 0.1        # Image translation (+/- fraction)
scale: 0.5            # Image scale
fliplr: 0.5           # Image flip left-right probability


# -----------------------------------------------------------------------------
# 5. Inference & NMS Thresholds
# -----------------------------------------------------------------------------
conf_thres: 0.001        # Low confidence threshold for mAP evaluation
iou_thres: 0.6           # NMS IoU threshold
predict_conf_thres: 0.3  # Confidence threshold for visible predictions (predict.py)


# -----------------------------------------------------------------------------
# 6. MLOps: Weights & Biases (wandb)
# -----------------------------------------------------------------------------
wandb_project: "yolov4-voc"
wandb_entity: null